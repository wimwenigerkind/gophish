{{- $sqlite := eq .Values.database.type "sqlite3" }}
{{- if not (has .Values.database.type (list "sqlite3" "mysql" "postgres")) }}
{{- fail "database.type must be sqlite3, mysql or postgres" }}
{{- end }}
{{- if and (not $sqlite) (not .Values.database.url) (not .Values.database.existingSecret) }}
{{- fail "database.url or database.existingSecret is required for mysql and postgres" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gophish.fullname" . }}
  labels:
    {{- include "gophish.labels" . | nindent 4 }}
spec:
  # A single replica, see values.yaml. Recreate keeps the old pod from sending
  # while the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gophish.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gophish.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gophish.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ADMIN_LISTEN_URL
              value: "0.0.0.0:3333"
            # TLS ends at the ingress.
            - name: ADMIN_USE_TLS
              value: "false"
            {{- with .Values.admin.trustedOrigins }}
            - name: ADMIN_TRUSTED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            # An unprivileged port, so the container needs no capabilities.
            - name: PHISH_LISTEN_URL
              value: "0.0.0.0:8080"
            - name: PHISH_USE_TLS
              value: "false"
            {{- with .Values.contactAddress }}
            - name: CONTACT_ADDRESS
              value: {{ . | quote }}
            {{- end }}
            - name: DB_NAME
              value: {{ .Values.database.type | quote }}
            {{- if $sqlite }}
            - name: DB_FILE_PATH
              value: /opt/gophish/data/gophish.db
            {{- else }}
            - name: DB_FILE_PATH
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophish.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- end }}
            {{- with .Values.admin.existingSecret }}
            - name: GOPHISH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.admin.existingSecretKey }}
            {{- end }}
          ports:
            - name: admin
              containerPort: 3333
              protocol: TCP
            - name: phish
              containerPort: 8080
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $sqlite .Values.volumeMounts }}
          volumeMounts:
            {{- if $sqlite }}
            - name: data
              mountPath: /opt/gophish/data
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or $sqlite .Values.volumes }}
      volumes:
        {{- if $sqlite }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "gophish.fullname" . }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
