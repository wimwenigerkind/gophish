{{- if and (ne .Values.database.type "sqlite3") (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gophish.databaseSecretName" . }}
  labels:
    {{- include "gophish.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
{{- end }}
