{{- range $name := list "admin" "phish" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophish.fullname" $ }}-{{ $name }}
  labels:
    {{- include "gophish.labels" $ | nindent 4 }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ index $.Values.service (printf "%sPort" $name) }}
      targetPort: {{ $name }}
      protocol: TCP
      name: {{ $name }}
  selector:
    {{- include "gophish.selectorLabels" $ | nindent 4 }}
{{- end }}
