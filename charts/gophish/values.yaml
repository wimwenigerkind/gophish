# Default values for gophish.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# gophish always runs as a single replica: the worker in every replica sends
# the queued emails, so a second replica would send each campaign twice.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/wimwenigerkind/gophish
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# Address shown to recipients who report a phishing email to the sender.
contactAddress: ""

database:
  # sqlite3, mysql or postgres
  type: sqlite3
  # Connection string for mysql or postgres, ignored when existingSecret is set, e.g.
  # postgres://gophish:secret@postgres:5432/gophish?sslmode=disable
  # gophish:secret@tcp(mysql:3306)/gophish?charset=utf8&parseTime=True&loc=UTC
  url: ""
  # Secret that holds the connection string, e.g. one managed by ExternalSecrets.
  existingSecret: ""
  existingSecretKey: url

# Volume for the SQLite database, unused with mysql or postgres.
persistence:
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

admin:
  # Origins allowed to post to the admin UI besides its own, e.g. when it is
  # reached under another host name.
  trustedOrigins: []
  # Secret with the password of the admin user created on first start.
  # Without it, gophish generates one and logs it once.
  existingSecret: ""
  existingSecretKey: password

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # gophish does not talk to the Kubernetes API.
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Meets the restricted Pod Security Standard; the image runs as uid 1000.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Two services, so the admin UI can stay internal while the phishing server
# is exposed. More information: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  adminPort: 3333
  phishPort: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  admin:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: gophish-admin.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: gophish-admin-tls
    #    hosts:
    #      - gophish-admin.local
  # Campaigns often use several domains, one host each.
  phish:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: gophish.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness, readiness and startup probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# gophish runs its migrations before it listens, so the startup probe waits
# for that first.
startupProbe:
  tcpSocket:
    port: admin
  periodSeconds: 5
  failureThreshold: 60
livenessProbe:
  tcpSocket:
    port: admin
readinessProbe:
  httpGet:
    path: /login
    port: admin

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
