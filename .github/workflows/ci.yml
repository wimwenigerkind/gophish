name: CI
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: diff -u <(echo -n) <(gofmt -d .)
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -v .

  test:
    name: Test (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite3
            path: ":memory:"
          - db: mysql
            # The driver writes an empty time.Time as '0000-00-00', which
            # MySQL rejects with NO_ZERO_DATE in its default sql_mode.
            path: "root:gophish@tcp(127.0.0.1:3306)/gophish_test?charset=utf8&parseTime=True&loc=UTC&sql_mode=%27STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION%27"
          - db: postgres
            path: "postgres://postgres:gophish@127.0.0.1:5432/gophish_test?sslmode=disable"
    # Every matrix entry starts both servers; only the selected one is used.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gophish
          MYSQL_DATABASE: gophish_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pgophish"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: gophish
          POSTGRES_DB: gophish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOPHISH_TEST_DB_NAME: ${{ matrix.db }}
      GOPHISH_TEST_DB_PATH: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Packages share one server database, so they run one at a time.
      - name: Test
        run: go test -p 1 ./...

  release:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
